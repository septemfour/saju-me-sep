<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>사주 입력</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: linear-gradient(180deg, #d9f9df 0%, #aee2ff 45%, #b5baff 100%);
      }
      #boot-fallback {
        font-family: system-ui, sans-serif;
        max-width: 420px;
        margin: 3rem auto;
        padding: 0 1rem;
        color: #2a2d4a;
        line-height: 1.6;
      }
      #boot-fallback code {
        display: block;
        margin: 0.75rem 0;
        padding: 0.75rem 1rem;
        background: rgba(255, 255, 255, 0.7);
        border-radius: 8px;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Vite(npm run dev)로 열면 이 문구는 React 앱으로 바로 교체됩니다 -->
      <div id="boot-fallback">
        <p><strong>사주 앱을 불러오는 중...</strong></p>
        <p>
          이 화면이 계속 보이면 Live Server(5500)로 연 것입니다.
          React 앱은 HTML 파일 직접 실행이 아니라 Vite로 실행해야 합니다.
        </p>
        <code>
          cd saju-me-sep<br />
          npm run dev
        </code>
        <p>그다음 브라우저에서 <strong>http://localhost:5188</strong> 로 접속하세요.</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
